name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # RetroFuturaGradle needs Gradle to run on Java 25. The mod itself builds on Java 8.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            25

      # This also validates the wrapper jar. The basic cache provider is the open-source one.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - uses: actions/upload-artifact@v7
        with:
          name: focalis-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
